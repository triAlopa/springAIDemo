# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'dev'
      paths-to-match: '/**'
      packages-to-scan: com.chen.controller
    - group: 'user'
      paths-to-match: '/**'
      packages-to-scan: com.chen.controller.user
    - group: 'admin'
      paths-to-match: '/admin'
      packages-to-scan: com.chen.controller.admin
