<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>验证码邮件</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f7fa;
            padding: 20px;
        }

        /* 邮件容器 */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* 邮件头部 */
        .email-header {
            background: linear-gradient(135deg, #4a6ee0 0%, #6a8cff 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .email-header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .email-header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 15px;
            display: inline-block;
        }

        /* 邮件主体 */
        .email-body {
            padding: 40px 30px;
        }

        .greeting {
            font-size: 18px;
            margin-bottom: 25px;
            color: #444;
        }

        .greeting strong {
            color: #4a6ee0;
        }

        .code-section {
            text-align: center;
            margin: 35px 0;
        }

        .code-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 12px;
        }

        .verification-code {
            display: inline-block;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%);
            border: 2px dashed #4a6ee0;
            border-radius: 10px;
            padding: 20px 30px;
            font-size: 36px;
            font-weight: 700;
            color: #4a6ee0;
            letter-spacing: 8px;
            margin: 15px 0;
            box-shadow: 0 4px 12px rgba(74, 110, 224, 0.15);
        }

        .instructions {
            background-color: #f8f9ff;
            border-left: 4px solid #4a6ee0;
            padding: 18px 20px;
            margin: 30px 0;
            border-radius: 0 8px 8px 0;
        }

        .instructions h3 {
            font-size: 16px;
            color: #4a6ee0;
            margin-bottom: 10px;
        }

        .instructions ul {
            padding-left: 20px;
            color: #555;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        /* 邮件底部 */
        .email-footer {
            background-color: #f8f9fa;
            padding: 25px 30px;
            text-align: center;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
        }

        .email-footer p {
            margin-bottom: 10px;
        }

        .support-contact {
            color: #4a6ee0;
            text-decoration: none;
            font-weight: 500;
        }

        .support-contact:hover {
            text-decoration: underline;
        }

        .expiry-notice {
            color: #e74c3c;
            font-weight: 600;
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #ffeaea;
            border-radius: 8px;
            display: inline-block;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .email-body {
                padding: 30px 20px;
            }

            .verification-code {
                font-size: 28px;
                letter-spacing: 6px;
                padding: 18px 20px;
            }

            .email-header h1 {
                font-size: 22px;
            }
        }

        @media (max-width: 400px) {
            .verification-code {
                font-size: 24px;
                letter-spacing: 4px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<div class="email-container">
    <div class="email-header">
        <div class="logo">BOSS求聘</div>
        <h1>安全验证码</h1>
        <p>请使用以下验证码完成您的操作</p>
    </div>

    <div class="email-body">
        <div class="greeting">
            尊敬的 <strong><span th:text="${nickName}">用户</span></strong>，您好！
        </div>

        <p>我们收到了您发起的验证请求，请使用下面的验证码完成您的操作：</p>

        <div class="code-section">
            <div class="code-label">您的验证码为：</div>
            <div class="verification-code">
                <span th:text="${code}"></span>
            </div>
            <div class="expiry-notice">请在两分钟内使用完成操作</div>
        </div>

        <div class="instructions">
            <h3>使用说明：</h3>
            <ul>
                <li>此验证码用于验证您的身份，请勿泄露给他人</li>
                <li>验证码有效期为两分钟，请尽快使用</li>
                <li>如非本人操作，请忽略此邮件</li>
                <li>平台仅供娱乐，请不要聊不合适的话题</li>
            </ul>
        </div>

        <p>如果您没有请求此验证码，请立即更改您的账户密码，并联系我们。</p>
    </div>

    <div class="email-footer">
        <p>此邮件为系统自动发送，请勿直接回复</p>
        <p>如有问题，请联系 <a href="mailto:trialopa@163.com" class="support-contact">trialopa@163.com</a></p>
        <p><b>再次声明，娱乐向，请勿上升高度</b></p>
    </div>
</div>
</body>
</html>
