<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS AI Chat</title>
    
    <!-- 1. 引入必要的库 -->
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Element Plus -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <link rel="stylesheet" href="https://unpkg.com/element-plus/theme-chalk/dark/css-vars.css">
    <script src="https://unpkg.com/element-plus"></script>
    <!-- Element Plus Icons -->
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <!-- Tailwind CSS (用于快速布局) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (更现代的图标库) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- 2. 配置 Tailwind 支持暗黑模式 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#00b1eb', // Bilibili Blue / Tech Blue
                        darkBg: '#1a1a1a',
                        darkSurface: '#242424',
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 3. 自定义 CSS */
        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* 玻璃拟态 (Glassmorphism) 基础类 */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 左侧侧边栏液态透明效果 */
        .liquid-sidebar {
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            backdrop-filter: blur(30px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .dark .liquid-sidebar {
            background: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 100%);
        }

        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 聊天气泡动态阴影 */
        .bubble-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .bubble-shadow:hover {
            box-shadow: 0 8px 25px rgba(0, 177, 235, 0.15);
            transform: translateY(-1px);
        }

        /* 暗黑模式扩散动画 */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation: none;
            mix-blend-mode: normal;
        }
        ::view-transition-old(root) {
            z-index: 1;
        }
        ::view-transition-new(root) {
            z-index: 9999;
        }
        .dark::view-transition-old(root) {
            z-index: 9999;
        }
        .dark::view-transition-new(root) {
            z-index: 1;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-500">

    <div id="app" class="h-screen w-full flex flex-col justify-center items-center overflow-hidden relative">
        
        <!-- 背景装饰球 (提升视觉丰富度) -->
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-300/30 rounded-full blur-[100px] pointer-events-none animate-float"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-purple-300/30 rounded-full blur-[100px] pointer-events-none animate-float" style="animation-delay: 1s;"></div>

        <!-- 核心容器：登录页 或 聊天主界面 -->
        <transition name="el-fade-in-linear" mode="out-in">
            
            <!-- 1. 登录注册页面 -->
            <login-view 
                v-if="!isLoggedIn" 
                @login-success="handleLoginSuccess"
            ></login-view>

            <!-- 2. 聊天主界面 (占比85%) -->
            <div v-else class="w-[95%] lg:w-[85%] h-[90vh] flex rounded-3xl overflow-hidden shadow-2xl border border-white/20 dark:border-gray-700 relative z-10 transition-all duration-300">
                
                <!-- 左侧侧边栏组件 -->
                <the-sidebar
                    :history="chatHistory"
                    :current-chat-id="currentChatId"
                    @select-chat="handleSelectChat"
                    @create-chat="handleCreateChat"
                    @delete-chat="handleDeleteChat"
                ></the-sidebar>

                <!-- 右侧聊天窗口组件 -->
                <the-chat-window
                    :messages="currentMessages"
                    :current-chat-title="currentChatTitle"
                    @send-message="handleSendMessage"
                >
                    <!-- 插槽：右上角个人信息胶囊 -->
                    <template #header-right>
                        <user-capsule 
                            :user="currentUser" 
                            :is-dark="isDark" 
                            @toggle-theme="toggleTheme"
                            @logout="handleLogout"
                            @check-in="handleCheckIn"
                        ></user-capsule>
                    </template>
                </the-chat-window>

            </div>
        </transition>

    </div>

    <!-- ========================================================================================== -->
    <!-- 组件定义区 -->
    <!-- ========================================================================================== -->

    <!-- 组件1: 登录视图 (LoginView) -->
    <script type="text/x-template" id="login-view-template">
        <div class="w-full h-full flex bg-white dark:bg-gray-900 relative z-20">
            <!-- 左侧 85%: 介绍与打字机 -->
            <div class="w-[85%] h-full relative flex flex-col justify-center items-center p-20 overflow-hidden bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-900 dark:to-gray-800">
                <!-- 装饰 -->
                <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=2574&auto=format&fit=crop')] bg-cover opacity-10 dark:opacity-5"></div>
                
                <h1 class="text-6xl font-bold mb-8 bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-600 tracking-tighter">BOSS AI</h1>
                <div class="h-32 text-2xl text-gray-600 dark:text-gray-300 font-mono text-center max-w-3xl leading-relaxed">
                    {{ typedText }}<span class="animate-pulse text-blue-500">|</span>
                </div>
            </div>

            <!-- 右侧 15%: 登录注册 (极简设计) -->
            <div class="w-[15%] min-w-[300px] h-full bg-white/80 dark:bg-gray-800/90 backdrop-blur-md border-l border-gray-200 dark:border-gray-700 flex flex-col p-6 shadow-2xl z-30">
                <div class="flex-1 flex flex-col justify-center">
                    <h2 class="text-2xl font-bold mb-6 text-center">{{ isRegister ? '加入我们' : '欢迎回来' }}</h2>
                    
                    <el-form :model="form" class="space-y-4">
                        <el-input v-model="form.email" placeholder="邮箱" size="large">
                            <template #prefix><i class="ph ph-envelope"></i></template>
                        </el-input>
                        
                        <el-input v-model="form.password" type="password" placeholder="密码" size="large" show-password>
                            <template #prefix><i class="ph ph-lock"></i></template>
                        </el-input>

                        <template v-if="isRegister">
                            <el-input v-model="form.confirmPassword" type="password" placeholder="确认密码" size="large">
                                <template #prefix><i class="ph ph-lock-key"></i></template>
                            </el-input>
                            
                            <div class="flex gap-2">
                                <el-input v-model="form.captcha" placeholder="验证码" class="flex-1">
                                </el-input>
                                <div @click="refreshCaptcha" class="w-20 h-9 bg-gray-200 cursor-pointer flex items-center justify-center text-xs tracking-widest font-bold italic select-none rounded overflow-hidden">
                                    <img :src="captchaUrl" class="w-full h-full object-cover opacity-80" />
                                </div>
                            </div>
                            
                             <el-input v-model="form.emailCode" placeholder="邮箱验证码">
                                <template #append>
                                    <el-button size="small">发送</el-button>
                                </template>
                            </el-input>
                        </template>

                        <el-button type="primary" class="w-full !h-10 !text-lg !rounded-xl !bg-[#00b1eb] hover:!bg-[#009acb] !border-none shadow-lg shadow-blue-200 dark:shadow-none transition-transform active:scale-95" @click="submit">
                            {{ isRegister ? '立即注册' : '登录' }}
                        </el-button>
                    </el-form>

                    <div class="mt-6 text-center text-sm text-gray-500">
                        {{ isRegister ? '已有账号?' : '还没有账号?' }}
                        <span @click="toggleMode" class="text-[#00b1eb] cursor-pointer hover:underline font-medium ml-1">
                            {{ isRegister ? '去登录' : '去注册' }}
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <!-- 组件2: 侧边栏 (TheSidebar) -->
    <script type="text/x-template" id="sidebar-template">
        <div class="w-64 lg:w-72 h-full liquid-sidebar flex flex-col border-r border-white/20 dark:border-gray-700/50 transition-all duration-300">
            <!-- Logo 区域 -->
            <div class="h-16 flex items-center px-6">
                <div class="w-8 h-8 rounded bg-gradient-to-tr from-blue-400 to-purple-500 flex items-center justify-center text-white font-bold mr-3">B</div>
                <span class="font-bold text-xl tracking-tight">BOSS</span>
            </div>

            <!-- 新建对话按钮 -->
            <div class="px-4 mb-4">
                <button @click="$emit('create-chat')" class="w-full py-3 px-4 bg-white/50 dark:bg-gray-700/50 hover:bg-white/80 dark:hover:bg-gray-600/80 backdrop-blur border border-gray-200 dark:border-gray-600 rounded-xl flex items-center gap-3 transition-all group shadow-sm hover:shadow-md">
                    <i class="ph ph-plus text-lg text-[#00b1eb]"></i>
                    <span class="text-sm font-medium">开启新对话</span>
                </button>
            </div>

            <!-- 历史列表 -->
            <div class="flex-1 overflow-y-auto no-scrollbar px-3 pb-4 space-y-1">
                <div class="text-xs font-medium text-gray-400 px-3 mb-2 mt-2 uppercase tracking-wider">Recent</div>
                
                <transition-group name="list">
                    <div 
                        v-for="chat in history" 
                        :key="chat.id"
                        @click="$emit('select-chat', chat.id)"
                        class="group relative flex items-center p-3 rounded-lg cursor-pointer transition-all duration-200 hover:bg-white/40 dark:hover:bg-gray-700/40 hover:translate-x-1"
                        :class="{'bg-white/60 dark:bg-gray-700/60 shadow-sm border border-white/40 dark:border-gray-600': currentChatId === chat.id}"
                    >
                        <i class="ph ph-chat-circle-text text-lg mr-3 text-gray-500" :class="{'text-[#00b1eb]': currentChatId === chat.id}"></i>
                        <div class="flex-1 overflow-hidden">
                            <div class="truncate text-sm font-medium">{{ chat.title }}</div>
                            <div class="truncate text-xs text-gray-400">{{ chat.date }}</div>
                        </div>
                        
                        <!-- 删除按钮 (悬停显示) -->
                        <button @click.stop="$emit('delete-chat', chat.id)" class="absolute right-2 opacity-0 group-hover:opacity-100 p-1.5 hover:bg-red-100 hover:text-red-500 rounded transition-all">
                            <i class="ph ph-trash"></i>
                        </button>
                    </div>
                </transition-group>
            </div>
            
            <!-- 底部装饰 (去掉多余设置) -->
            <div class="p-4 text-xs text-center text-gray-400 opacity-50">
                BOSS AI v1.0.2
            </div>
        </div>
    </script>

    <!-- 组件3: 聊天主窗口 (TheChatWindow) -->
    <script type="text/x-template" id="chat-window-template">
        <div class="flex-1 h-full bg-white/30 dark:bg-gray-800/30 flex flex-col relative backdrop-blur-sm">
            
            <!-- 顶部导航 -->
            <header class="h-16 px-6 border-b border-gray-100 dark:border-gray-700/50 flex items-center justify-between bg-white/40 dark:bg-gray-900/40 backdrop-blur-md z-10">
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-lg">{{ currentChatTitle }}</span>
                    <span class="px-2 py-0.5 rounded text-[10px] bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold">GPT-4</span>
                </div>
                <!-- 插槽位置：放置胶囊个人信息 -->
                <slot name="header-right"></slot>
            </header>

            <!-- 消息滚动区域 -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth" ref="messageContainer">
                <transition-group name="fade-slide">
                    <div v-for="(msg, index) in messages" :key="index" 
                         class="flex w-full" 
                         :class="msg.role === 'user' ? 'justify-end' : 'justify-start'">
                        
                        <!-- AI 头像 -->
                        <div v-if="msg.role === 'ai'" class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-cyan-400 flex-shrink-0 mr-3 flex items-center justify-center text-white shadow-lg">
                            <i class="ph ph-robot text-lg"></i>
                        </div>

                        <!-- 气泡 -->
                        <div class="max-w-[70%] bubble-shadow p-4 rounded-2xl relative text-sm leading-relaxed break-words"
                             :class="msg.role === 'user' 
                                ? 'bg-[#00b1eb] text-white rounded-tr-none' 
                                : 'bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-tl-none border border-gray-100 dark:border-gray-600'">
                            
                            <!-- 文本内容 -->
                            <div v-if="msg.type === 'text'" class="whitespace-pre-wrap">{{ msg.content }}</div>
                            
                            <!-- 图片内容 -->
                            <el-image 
                                v-else-if="msg.type === 'image'" 
                                :src="msg.content" 
                                :preview-src-list="[msg.content]"
                                class="rounded-lg max-h-60 w-auto"
                                fit="cover">
                            </el-image>

                            <div class="text-[10px] mt-1 opacity-60 text-right" :class="msg.role === 'user' ? 'text-blue-100' : 'text-gray-400'">
                                {{ msg.time }}
                            </div>
                        </div>

                        <!-- 用户头像 -->
                        <div v-if="msg.role === 'user'" class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden flex-shrink-0 ml-3 shadow-md border-2 border-white dark:border-gray-600">
                             <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&h=100" alt="User">
                        </div>
                    </div>
                </transition-group>
            </div>

            <!-- 输入区域 -->
            <div class="p-6 pt-2">
                <div class="relative bg-white dark:bg-gray-700 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-600 p-2 transition-shadow focus-within:shadow-2xl focus-within:ring-1 focus-within:ring-blue-400/30">
                    <div class="flex items-end gap-2">
                        <button class="p-2 text-gray-400 hover:text-[#00b1eb] hover:bg-blue-50 dark:hover:bg-gray-600 rounded-lg transition-colors" title="上传图片" @click="triggerFileUpload">
                            <i class="ph ph-image text-xl"></i>
                        </button>
                        <textarea 
                            v-model="inputContent" 
                            @keydown.enter.prevent="send"
                            placeholder="输入消息给 BOSS AI..." 
                            class="flex-1 bg-transparent border-none outline-none resize-none max-h-32 py-2 text-sm dark:text-white scrollbar-hide"
                            rows="1"
                            @input="autoResize"
                            ref="textareaRef"
                        ></textarea>
                        <button 
                            @click="send"
                            :disabled="!inputContent.trim()"
                            class="p-2 rounded-xl bg-[#00b1eb] text-white shadow-lg shadow-blue-200 dark:shadow-none hover:scale-105 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                            <i class="ph ph-paper-plane-right text-xl"></i>
                        </button>
                    </div>
                </div>
                <div class="text-center mt-2 text-xs text-gray-400">AI generated content may be inaccurate.</div>
            </div>
        </div>
    </script>

    <!-- 组件4: 用户胶囊 (UserCapsule) -->
    <script type="text/x-template" id="user-capsule-template">
        <div class="flex items-center gap-4">
            <!-- 主题切换 -->
            <button @click="handleToggleTheme" class="relative w-14 h-7 rounded-full bg-gray-200 dark:bg-gray-700 transition-colors overflow-hidden border border-gray-300 dark:border-gray-600 shadow-inner flex items-center px-1">
                <div class="absolute inset-0 bg-[#00b1eb]/10 dark:bg-purple-500/10"></div>
                <div class="w-5 h-5 rounded-full bg-white shadow-md transform transition-transform duration-500 flex items-center justify-center z-10"
                     :class="isDark ? 'translate-x-7' : 'translate-x-0'">
                    <i class="ph-fill text-xs" :class="isDark ? 'ph-moon text-indigo-500' : 'ph-sun text-orange-400'"></i>
                </div>
            </button>

            <!-- 胶囊结构 -->
            <el-popover
                placement="bottom-end"
                :width="320"
                trigger="hover"
                popper-class="!p-0 !rounded-2xl !border-0 !shadow-2xl"
                :show-arrow="false"
                transition="el-zoom-in-top"
            >
                <template #reference>
                    <div class="flex items-center gap-3 pl-1 pr-4 py-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full shadow-sm cursor-pointer hover:shadow-md hover:border-blue-300 transition-all group">
                        <div class="w-8 h-8 rounded-full overflow-hidden border border-gray-100">
                            <img :src="user.avatar" class="w-full h-full object-cover group-hover:scale-110 transition-transform">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-gray-700 dark:text-gray-200">{{ user.name }}</span>
                            <span class="text-[10px] text-gray-400">Lv.{{ user.level }}</span>
                        </div>
                        <i class="ph ph-caret-down text-xs text-gray-400"></i>
                    </div>
                </template>
                
                <!-- 弹窗内容 (仿B站用户卡片) -->
                <div class="bg-white dark:bg-gray-800 rounded-2xl overflow-hidden">
                    <!-- 顶部背景图 -->
                    <div class="h-20 bg-gradient-to-r from-pink-300 to-blue-300 relative">
                        <div class="absolute -bottom-8 left-6 w-16 h-16 rounded-full border-2 border-white dark:border-gray-800 overflow-hidden shadow-lg z-10">
                            <img :src="user.avatar" class="w-full h-full object-cover">
                        </div>
                    </div>
                    
                    <div class="pt-10 px-6 pb-6">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg dark:text-white">{{ user.name }}</h3>
                                <div class="text-xs text-gray-400 mt-1">硬币: {{ user.coins }} <span class="mx-1">|</span> 积分: {{ user.points }}</div>
                            </div>
                            <!-- 签到按钮 -->
                            <button 
                                @click="$emit('check-in')"
                                :disabled="user.isCheckedIn"
                                class="px-4 py-1.5 rounded-full text-xs font-bold text-white transition-all shadow-md"
                                :class="user.isCheckedIn ? 'bg-gray-300 cursor-not-allowed' : 'bg-[#00b1eb] hover:bg-[#009acb] hover:shadow-blue-200/50 active:scale-95'"
                            >
                                {{ user.isCheckedIn ? '已签到' : '签到' }}
                            </button>
                        </div>

                        <div class="flex justify-between mt-6 px-2">
                            <div class="text-center cursor-pointer hover:text-[#00b1eb] transition-colors">
                                <div class="font-bold text-lg dark:text-gray-200">104</div>
                                <div class="text-xs text-gray-400">关注</div>
                            </div>
                            <div class="text-center cursor-pointer hover:text-[#00b1eb] transition-colors">
                                <div class="font-bold text-lg dark:text-gray-200">7</div>
                                <div class="text-xs text-gray-400">粉丝</div>
                            </div>
                            <div class="text-center cursor-pointer hover:text-[#00b1eb] transition-colors">
                                <div class="font-bold text-lg dark:text-gray-200">68</div>
                                <div class="text-xs text-gray-400">动态</div>
                            </div>
                        </div>

                        <div class="mt-6 space-y-1">
                            <div class="flex items-center justify-between p-2 rounded hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors group">
                                <span class="text-sm text-gray-600 dark:text-gray-300 flex items-center gap-2">
                                    <i class="ph ph-user group-hover:text-[#00b1eb]"></i> 个人中心
                                </span>
                                <i class="ph ph-caret-right text-xs text-gray-400"></i>
                            </div>
                             <div class="flex items-center justify-between p-2 rounded hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors group">
                                <span class="text-sm text-gray-600 dark:text-gray-300 flex items-center gap-2">
                                    <i class="ph ph-gear group-hover:text-[#00b1eb]"></i> 设置
                                </span>
                                <i class="ph ph-caret-right text-xs text-gray-400"></i>
                            </div>
                        </div>
                        
                        <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-700">
                            <button @click="$emit('logout')" class="w-full text-left text-sm text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 p-2 rounded transition-colors">
                                <i class="ph ph-sign-out mr-2"></i> 退出登录
                            </button>
                        </div>
                    </div>
                </div>
            </el-popover>
        </div>
    </script>

    <!-- ========================================================================================== -->
    <!-- JavaScript 逻辑区 -->
    <!-- ========================================================================================== -->
    <script>
        const { createApp, ref, reactive, onMounted, computed, nextTick } = Vue;

        // --- 模拟数据 (Mock Data) ---
        const MOCK_HISTORY = [
            { id: 1, title: "Vue3 Setup 语法糖问题", date: "刚刚" },
            { id: 2, title: "生成一幅赛博朋克图片", date: "昨天" },
            { id: 3, title: "解释量子纠缠", date: "2天前" },
            { id: 4, title: "Python 爬虫脚本优化", date: "1周前" },
        ];

        const MOCK_MESSAGES = {
            1: [
                { role: 'user', type: 'text', content: 'Vue3 的 setup 语法糖有什么优势？', time: '10:00' },
                { role: 'ai', type: 'text', content: 'Vue 3 的 `<script setup>` 语法糖主要有以下优势：\n1. **更少的样板代码**：无需 `return` 暴露变量。\n2. **更好的 TypeScript 支持**：原生支持纯 TS 声明。\n3. **更好的运行时性能**：模板会被编译成更高效的渲染函数。\n\n需要我给你写个例子吗？', time: '10:01' }
            ],
            2: [
                { role: 'user', type: 'text', content: '生成一张图片：未来的上海。', time: '14:20' },
                { role: 'ai', type: 'text', content: '正在为你生成...', time: '14:20' },
                { role: 'ai', type: 'image', content: 'https://images.unsplash.com/photo-1480796927426-f609979314bd?q=80&w=2000&auto=format&fit=crop', time: '14:21' }
            ]
        };

        // --- Login 组件 ---
        const LoginView = {
            template: '#login-view-template',
            emits: ['login-success'],
            setup(props, { emit }) {
                const isRegister = ref(false);
                const typedText = ref('');
                const fullText = "欢迎来到 BOSS AI。\n这里是思维的延伸，创意的起点。\n准备好开始探索了吗？";
                
                // 打字机效果
                let typeInterval = null;
                let deleteInterval = null;

                const startTyping = () => {
                    let i = 0;
                    let isDeleting = false;
                    clearInterval(typeInterval);
                    
                    typeInterval = setInterval(() => {
                        if (!isDeleting && i <= fullText.length) {
                            typedText.value = fullText.slice(0, i);
                            i++;
                            if (i > fullText.length) {
                                isDeleting = true;
                                setTimeout(() => { /* 停顿 */ }, 2000);
                            }
                        } else if (isDeleting && i >= 0) {
                            // 简单的循环逻辑，这里为了简化，打完字就停留在那里，或者你可以开启回删
                             clearInterval(typeInterval); // 停止
                        }
                    }, 100);
                };

                onMounted(() => {
                    startTyping();
                });

                const form = reactive({
                    email: '',
                    password: '',
                    confirmPassword: '',
                    captcha: '',
                    emailCode: ''
                });

                const captchaUrl = ref('https://dummyimage.com/100x40/e0e0e0/555555&text=A3d9');

                const toggleMode = () => {
                    isRegister.value = !isRegister.value;
                    form.email = '';
                    form.password = '';
                };

                const refreshCaptcha = () => {
                    // 模拟刷新验证码
                    const random = Math.floor(Math.random() * 1000);
                    captchaUrl.value = `https://dummyimage.com/100x40/e0e0e0/555555&text=${random}`;
                };

                const submit = () => {
                    if (!form.email || !form.password) {
                        ElementPlus.ElMessage.warning('请填写完整信息');
                        return;
                    }
                    // 模拟登录/注册请求
                    setTimeout(() => {
                        emit('login-success');
                        ElementPlus.ElMessage.success(isRegister.value ? '注册成功并登录' : '登录成功');
                    }, 800);
                };

                return { isRegister, typedText, form, captchaUrl, toggleMode, refreshCaptcha, submit };
            }
        };

        // --- Sidebar 组件 ---
        const TheSidebar = {
            template: '#sidebar-template',
            props: ['history', 'currentChatId'],
            emits: ['select-chat', 'create-chat', 'delete-chat'],
            setup() {
                return {};
            }
        };

        // --- UserCapsule 组件 ---
        const UserCapsule = {
            template: '#user-capsule-template',
            props: ['user', 'isDark'],
            emits: ['toggle-theme', 'logout', 'check-in'],
            setup(props, { emit }) {
                const handleToggleTheme = (event) => {
                    // 扩散效果逻辑
                    const x = event.clientX;
                    const y = event.clientY;
                    
                    // 传递坐标给父组件做动画（或者直接在这里简单切换）
                    emit('toggle-theme', { x, y });
                };
                
                return { handleToggleTheme };
            }
        };

        // --- ChatWindow 组件 ---
        const TheChatWindow = {
            template: '#chat-window-template',
            props: ['messages', 'currentChatTitle'],
            emits: ['send-message'],
            setup(props, { emit }) {
                const inputContent = ref('');
                const textareaRef = ref(null);
                const messageContainer = ref(null);

                const autoResize = () => {
                    const el = textareaRef.value;
                    if (el) {
                        el.style.height = 'auto';
                        el.style.height = el.scrollHeight + 'px';
                    }
                };

                const scrollToBottom = () => {
                    nextTick(() => {
                        if (messageContainer.value) {
                            messageContainer.value.scrollTop = messageContainer.value.scrollHeight;
                        }
                    });
                };

                // 监听消息变化滚动到底部
                Vue.watch(() => props.messages, () => {
                    scrollToBottom();
                }, { deep: true });

                const send = () => {
                    if (!inputContent.value.trim()) return;
                    emit('send-message', inputContent.value);
                    inputContent.value = '';
                    autoResize(); // 重置高度
                };
                
                const triggerFileUpload = () => {
                    ElementPlus.ElMessage.info('图片上传功能演示：点击发送会自动模拟图片回复');
                };

                return { inputContent, send, autoResize, textareaRef, messageContainer, triggerFileUpload };
            }
        };

        // --- 主 APP ---
        const app = createApp({
            components: {
                LoginView,
                TheSidebar,
                TheChatWindow,
                UserCapsule
            },
            setup() {
                const isLoggedIn = ref(false);
                const isDark = ref(false);
                
                // 用户状态
                const currentUser = reactive({
                    name: '春乏夏困', // 参考图片
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&h=100',
                    level: 6,
                    coins: 726.5,
                    points: 104,
                    isCheckedIn: false
                });

                // 聊天数据
                const chatHistory = ref([...MOCK_HISTORY]);
                const currentChatId = ref(1);
                const messagesStore = reactive({...MOCK_MESSAGES});

                // 计算属性
                const currentMessages = computed(() => {
                    return messagesStore[currentChatId.value] || [];
                });

                const currentChatTitle = computed(() => {
                    const chat = chatHistory.value.find(c => c.id === currentChatId.value);
                    return chat ? chat.title : '新对话';
                });

                // 方法
                const handleLoginSuccess = () => {
                    isLoggedIn.value = true;
                };

                const handleLogout = () => {
                    ElementPlus.ElMessageBox.confirm('确定要退出登录吗?', '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning',
                    }).then(() => {
                        isLoggedIn.value = false;
                    });
                };

                const toggleTheme = ({ x, y }) => {
                    // 使用 View Transitions API (如果在 Chrome 111+ 下)
                    const isSupported = document.startViewTransition;
                    
                    if (!isSupported) {
                        isDark.value = !isDark.value;
                        updateThemeClass();
                        return;
                    }

                    const endRadius = Math.hypot(
                        Math.max(x, innerWidth - x),
                        Math.max(y, innerHeight - y)
                    );

                    const transition = document.startViewTransition(() => {
                        isDark.value = !isDark.value;
                        updateThemeClass();
                    });

                    transition.ready.then(() => {
                        const clipPath = [
                            `circle(0px at ${x}px ${y}px)`,
                            `circle(${endRadius}px at ${x}px ${y}px)`,
                        ];
                        document.documentElement.animate(
                            {
                                clipPath: isDark.value ? [...clipPath] : [...clipPath].reverse(),
                            },
                            {
                                duration: 400,
                                easing: 'ease-in',
                                pseudoElement: isDark.value
                                    ? '::view-transition-new(root)'
                                    : '::view-transition-old(root)',
                            }
                        );
                    });
                };

                const updateThemeClass = () => {
                    if (isDark.value) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                };

                const handleCheckIn = () => {
                    if (currentUser.isCheckedIn) return;
                    currentUser.isCheckedIn = true;
                    currentUser.coins += 10;
                    ElementPlus.ElMessage.success('签到成功！硬币 +10');
                };

                const handleSelectChat = (id) => {
                    currentChatId.value = id;
                };

                const handleCreateChat = () => {
                    const newId = Date.now();
                    chatHistory.value.unshift({
                        id: newId,
                        title: '新对话',
                        date: '刚刚'
                    });
                    messagesStore[newId] = [];
                    currentChatId.value = newId;
                };

                const handleDeleteChat = (id) => {
                    ElementPlus.ElMessageBox.confirm(
                        '确定删除该对话记录吗?',
                        '警告',
                        {
                            confirmButtonText: '删除',
                            cancelButtonText: '取消',
                            type: 'warning',
                        }
                    ).then(() => {
                        chatHistory.value = chatHistory.value.filter(c => c.id !== id);
                        delete messagesStore[id];
                        if (currentChatId.value === id && chatHistory.value.length > 0) {
                            currentChatId.value = chatHistory.value[0].id;
                        }
                        ElementPlus.ElMessage.success('删除成功');
                    });
                };

                const handleSendMessage = (text) => {
                    // 1. 添加用户消息
                    if (!messagesStore[currentChatId.value]) {
                        messagesStore[currentChatId.value] = [];
                    }
                    
                    const now = new Date();
                    const timeString = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
                    
                    messagesStore[currentChatId.value].push({
                        role: 'user',
                        type: 'text',
                        content: text,
                        time: timeString
                    });

                    // 更新标题 (如果是第一条)
                    const currentChat = chatHistory.value.find(c => c.id === currentChatId.value);
                    if (currentChat && currentChat.title === '新对话') {
                        currentChat.title = text.substring(0, 10) + (text.length > 10 ? '...' : '');
                    }

                    // 2. 模拟 AI 回复
                    setTimeout(() => {
                        messagesStore[currentChatId.value].push({
                            role: 'ai',
                            type: 'text',
                            content: 'BOSS AI 收到你的消息: "' + text + '"\n这是一个模拟的回复。后端接入时替换此逻辑。',
                            time: timeString
                        });
                    }, 1000);
                };

                return {
                    isLoggedIn,
                    isDark,
                    currentUser,
                    chatHistory,
                    currentChatId,
                    currentMessages,
                    currentChatTitle,
                    handleLoginSuccess,
                    handleLogout,
                    toggleTheme,
                    handleCheckIn,
                    handleSelectChat,
                    handleCreateChat,
                    handleDeleteChat,
                    handleSendMessage
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
